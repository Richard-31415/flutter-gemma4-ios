name: gemma4_ios_demo
description: "Minimal Flutter example running Gemma 4 on iOS via flutter_gemma."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_gemma: ^0.15.0
  record: ^6.0.0          # native mic capture (Path A audio input)
  path_provider: ^2.1.0   # temp dir for recorded WAV file

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
